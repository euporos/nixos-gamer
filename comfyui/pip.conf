# Runtime pip policy, scoped to `pip install` ONLY (PIP_USER/PIP_CONSTRAINT
# env vars would also apply to `pip list`/`freeze`, which then show just the
# user site — ComfyUI-Manager reads `pip list` and concluded "PyTorch is not
# installed" and started "fixing" packages).
#   user:       installs land in PYTHONUSERBASE=/data/.local (persistent),
#               never in the image.
#   constraint: torch/torchvision stay on the Pascal-capable cu126 build.
[install]
user = true
constraint = /etc/comfyui/torch-pins.txt
